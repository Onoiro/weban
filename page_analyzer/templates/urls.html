{% extends 'bootstrap/base.html' %}

{% block content %}
<main class="flex-grow-1">
    <div class="container-lg mt-3">
      <h1 class="mb-3">Сайты</h1>
        <div class="table-responsive">
            <table class="table table-bordered table-hover" data-test="urls">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Имя</th>
                        <th>Последняя проверка</th>
                        <th>Код ответа</th>
                    </tr>
                </thead>
                <tbody>
                    {% for url in urls %}
                    <tr>
                        <td class="text-nowrap">{{ url.id }}</td>
                        <td>
                            <a href="/urls/{{ url.id }}" class="text-break">{{ url['name'] }}</a>
                        </td>
                        <td class="text-nowrap">
                            {% if url.last_check %}
                                {{ url.last_check }}
                            {% endif %}
                        </td>
                        <td class="text-nowrap">
                            {% if url.status_code %}
                                {{ url.status_code }}
                            {% endif %}
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</main>
{% endblock %}
